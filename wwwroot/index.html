<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MiniCPM-V OCR Demo</title>
    <style>
        :root {
            --primary: #4F46E5;
            --primary-hover: #4338CA;
            --bg: #F9FAFB;
            --card-bg: #FFFFFF;
            --text: #1F2937;
            --border: #E5E7EB;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            max-width: 800px;
            width: 100%;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 28px;
            margin-bottom: 8px;
            color: #111827;
        }

        .header p {
            color: #6B7280;
            font-size: 15px;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            margin-bottom: 24px;
        }

        .drop-zone {
            border: 2px dashed #CBD5E1;
            border-radius: 8px;
            padding: 30px;
            text-align: center;
            cursor: pointer;
            transition: border-color 0.2s;
            background: #F8FAFC;
        }

        .drop-zone:hover {
            border-color: var(--primary);
        }

        .preview-container {
            margin-top: 20px;
            display: none;
            text-align: center;
        }

        .preview-img {
            max-width: 100%;
            max-height: 350px;
            border-radius: 8px;
            border: 1px solid var(--border);
        }

        .form-group {
            margin-top: 20px;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 6px;
            font-size: 14px;
        }

        input[type="text"] {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 14px;
            box-sizing: border-box;
        }

        .btn-group {
            display: flex;
            gap: 12px;
            margin-top: 20px;
        }

        button {
            flex: 1;
            padding: 12px 20px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        button:disabled {
            background-color: #9CA3AF;
            cursor: not-allowed;
        }

        .output-box {
            white-space: pre-wrap;
            background: #1E293B;
            color: #F8FAFC;
            padding: 16px;
            border-radius: 8px;
            font-family: monospace;
            font-size: 14px;
            min-height: 120px;
            margin-top: 10px;
        }

        .meta-info {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            color: #6B7280;
            margin-top: 8px;
        }

        .status {
            font-weight: 600;
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="header">
            <h1>MiniCPM-V OCR Demo</h1>
            <p>Upload an image to extract text using the local MiniCPM-V vision model</p>
        </div>

        <div class="card">
            <div class="drop-zone" id="dropZone">
                <p><strong>Click to select an image</strong> or drag & drop here</p>
                <input type="file" id="fileInput" accept="image/*" style="display: none;">
            </div>

            <div class="preview-container" id="previewContainer">
                <img id="previewImg" class="preview-img" alt="Uploaded Image Preview">
            </div>

            <div class="form-group">
                <label for="modelSelect">Vision Model:</label>
                <select id="modelSelect"
                    style="width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 6px; font-size: 14px;">
                    <option value="openbmb/minicpm-v">OpenBMB MiniCPM-V (Official Tag)</option>
                    <option value="llama3.2-vision:1b">Llama 3.2 Vision 1B (1.5 GB - Lightweight)</option>
                    <option value="moondream">Moondream Vision OCR (825 MB - Ultra Low RAM)</option>
                    <option value="minicpm-v">MiniCPM-V (Local Original - 5.5 GB)</option>
                </select>
            </div>

            <div class="form-group">
                <label for="promptInput">Prompt (Optional):</label>
                <input type="text" id="promptInput"
                    value="Perform strict OCR. Transcribe all text visible in this image line by line. Do NOT describe the image or explain anything. Output ONLY raw text.">
            </div>

            <div class="btn-group">
                <button id="processBtn" disabled>Extract Text</button>
                <button id="streamBtn" disabled style="background-color: #059669;">Stream Text</button>
            </div>
        </div>

        <div class="card">
            <h3>Extracted Output:</h3>
            <div id="output" class="output-box">No text extracted yet...</div>
            <div class="meta-info">
                <span id="status" class="status">Status: Ready</span>
                <span id="timing">Execution Time: -</span>
            </div>
        </div>
    </div>

    <script>
        const fileInput = document.getElementById('fileInput');
        const dropZone = document.getElementById('dropZone');
        const previewContainer = document.getElementById('previewContainer');
        const previewImg = document.getElementById('previewImg');
        const processBtn = document.getElementById('processBtn');
        const streamBtn = document.getElementById('streamBtn');
        const promptInput = document.getElementById('promptInput');
        const output = document.getElementById('output');
        const status = document.getElementById('status');
        const timing = document.getElementById('timing');

        let selectedFile = null;

        dropZone.addEventListener('click', () => fileInput.click());

        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                handleFile(e.target.files[0]);
            }
        });

        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.style.borderColor = '#4F46E5';
        });

        dropZone.addEventListener('dragleave', () => {
            dropZone.style.borderColor = '#CBD5E1';
        });

        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.style.borderColor = '#CBD5E1';
            if (e.dataTransfer.files.length > 0) {
                handleFile(e.dataTransfer.files[0]);
            }
        });

        function handleFile(file) {
            selectedFile = file;
            const reader = new FileReader();
            reader.onload = (e) => {
                previewImg.src = e.target.result;
                previewContainer.style.display = 'block';
                processBtn.disabled = false;
                streamBtn.disabled = false;
            };
            reader.readAsDataURL(file);
        }

        const modelSelect = document.getElementById('modelSelect');

        processBtn.addEventListener('click', async () => {
            if (!selectedFile) return;

            setLoading(true, "Processing OCR...");
            const formData = new FormData();
            formData.append('file', selectedFile);
            formData.append('prompt', promptInput.value);
            formData.append('model', modelSelect.value);

            try {
                const res = await fetch('/api/ocr/upload', {
                    method: 'POST',
                    body: formData
                });

                const data = await res.json();
                if (data.success) {
                    output.textContent = data.extractedText || "(No text detected)";
                    timing.textContent = `Execution Time: ${data.executionTimeMs} ms (${data.modelUsed})`;
                    status.textContent = "Status: Completed";
                } else {
                    output.textContent = `Error: ${data.errorMessage}`;
                    status.textContent = "Status: Failed";
                }
            } catch (err) {
                output.textContent = `Request Error: ${err.message}`;
                status.textContent = "Status: Error";
            } finally {
                setLoading(false);
            }
        });

        streamBtn.addEventListener('click', async () => {
            if (!selectedFile) return;

            setLoading(true, "Streaming OCR...");
            output.textContent = "";

            const reader = new FileReader();
            reader.onload = async (e) => {
                const base64 = e.target.result;
                const startTime = performance.now();

                try {
                    const res = await fetch('/api/ocr/stream', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            imageBase64: base64,
                            prompt: promptInput.value,
                            model: modelSelect.value
                        })
                    });

                    const streamReader = res.body.getReader();
                    const decoder = new TextDecoder();

                    while (true) {
                        const { done, value } = await streamReader.read();
                        if (done) break;
                        output.textContent += decoder.decode(value, { stream: true });
                    }

                    const endTime = performance.now();
                    timing.textContent = `Execution Time: ${Math.round(endTime - startTime)} ms (Streaming)`;
                    status.textContent = "Status: Streaming Completed";
                } catch (err) {
                    output.textContent = `Stream Error: ${err.message}`;
                    status.textContent = "Status: Error";
                } finally {
                    setLoading(false);
                }
            };
            reader.readAsDataURL(selectedFile);
        });

        function setLoading(isLoading, statusText = "Ready") {
            processBtn.disabled = isLoading;
            streamBtn.disabled = isLoading;
            status.textContent = `Status: ${statusText}`;
        }
    </script>
</body>

</html>
